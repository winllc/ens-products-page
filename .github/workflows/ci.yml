name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      # Pricing arithmetic, license signing and verification, accounts and
      # license management, and the cross-language fixtures.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The same render the web container runs at start, against the build
      # output: one product with a demo URL, the rest without.
      - name: Render as the container would
        env:
          CERTALERT_DEMO_URL: https://demo.example.com/certalert
        run: |
          npm run render
          grep -q 'href="https://demo.example.com/certalert"' dist-rendered/products/certalert.html
          grep -q 'Demo unavailable' dist-rendered/products/readyroom.html
          if grep -rq '<!--\(NO\)\?DEMO:' dist-rendered; then exit 1; fi
          if grep -rq '_DEMO_URL}' dist-rendered; then exit 1; fi
          grep -q 'href="https://winllc.github.io/ens-apps-documentation/cert-alert/install/"' dist-rendered/products/certalert.html

      - name: Licensing service starts and answers
        run: |
          DATA_DIR=$RUNNER_TEMP/licensing HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:4321/api/licensing/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4321/api/licensing/keys | grep -q Ed25519
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/account)" = 303
          # The audit pull API wants a bearer token; the service records its own start.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/api/audit/events)" = 401

      - name: Docker images
        run: |
          docker build --target web -t ens-products-page .
          docker build --target licensing -t ens-products-licensing .

  java-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Verifies the license files the site's TypeScript code signed
      # (licensing/fixtures), so the two implementations can't drift apart.
      - name: Test
        working-directory: licensing/java
        run: mvn -B test

      # The applications in the field run ens-license 1.0.0, from before
      # ECDSA. They must still read a dual-signed file through its Ed25519
      # block, so nothing has to be upgraded in step with the portal.
      - name: ens-license 1.0.0 reads dual-signed licenses
        run: |
          v1=4313f697e49b51cc3585f49dae5a6d7dabe4ebad
          git fetch --no-tags --depth=1 origin "$v1"
          mkdir -p "$RUNNER_TEMP/v1/src" "$RUNNER_TEMP/v1/classes"
          git archive "$v1" licensing/java/src/main | tar -x -C "$RUNNER_TEMP/v1/src"
          javac --release 17 -nowarn -d "$RUNNER_TEMP/v1/classes" $(find "$RUNNER_TEMP/v1/src" -name '*.java') \
            licensing/java/src/test/java/com/enssolutions/license/LegacyReaderCheck.java
          java -cp "$RUNNER_TEMP/v1/classes" com.enssolutions.license.LegacyReaderCheck licensing/fixtures

  # Licenses on Java in FIPS mode, which has no Ed25519 (licensing/README.md,
  # "FIPS 140-3"). Runs licensing/java's FipsCheck, which first confirms the
  # runtime really is in the FIPS configuration named, then that dual-signed
  # and P-256-only fixtures verify (through ECDSA P-256 when Ed25519 is
  # missing), a tampered P-256 file is refused, Ed25519-only files are
  # accepted or refused as UNSUPPORTED_ALGORITHM according to what the
  # runtime has, and a LicenseManager comes up licensed.
  #
  # What it proves: the library works with the FIPS providers themselves
  # (SunPKCS11-NSS-FIPS over the NSS FIPS token, and BCFIPS in approved-only
  # mode), as configured by Red Hat's JDK and by BouncyCastle. What it
  # doesn't: the runner's kernel is not in FIPS mode. NSS_FIPS=1 makes NSS,
  # and so the JDK, act as it does when /proc/sys/crypto/fips_enabled is 1,
  # which is all Red Hat's OpenJDK looks at; the kernel's own crypto and a
  # host's FIPS crypto-policy play no part in license checks. Nor does it
  # certify anything: the CMVP certificate is the module vendor's.
  licensing-fips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build the verifier and FipsCheck
        working-directory: licensing/java
        run: mvn -B -q test-compile

      # The UBI 9 runtimes the applications ship on; latest on purpose, so a
      # change in Red Hat's FIPS mode shows up here first.
      - name: Red Hat OpenJDK in FIPS mode
        run: |
          for image in registry.access.redhat.com/ubi9/openjdk-21-runtime:latest \
                       registry.access.redhat.com/ubi9/openjdk-17-runtime:latest; do
            echo "::group::$image, NSS_FIPS=1"
            docker run --rm --network none -e NSS_FIPS=1 -v "$PWD/licensing:/licensing:ro" "$image" \
              java -cp /licensing/java/target/classes:/licensing/java/target/test-classes \
              com.enssolutions.license.FipsCheck /licensing/fixtures redhat-fips
            echo "::endgroup::"
          done

      # BCFIPS as the only crypto provider (SUN stays, for keystores), in
      # approved-only mode. 2.0.0 and 2.1.0 are the releases named in CMVP
      # certificates #4743 and #4943; neither offers Ed25519 in approved-only
      # mode (2.0.0 has no Ed25519 KeyFactory at all). 2.1.3 does.
      - name: BouncyCastle FIPS, approved-only mode
        working-directory: licensing/java
        run: |
          security="$RUNNER_TEMP/bcfips.java.security"
          grep -v '^security\.provider\.' "$JAVA_HOME/conf/security/java.security" > "$security"
          printf 'security.provider.1=org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider\nsecurity.provider.2=SUN\n' >> "$security"
          for v in 2.0.0 2.1.0 2.1.3; do
            mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
              -Dartifact=org.bouncycastle:bc-fips:$v -DoutputDirectory="$RUNNER_TEMP/bc-fips"
            echo "::group::bc-fips $v"
            java -Djava.security.properties=="$security" -Dorg.bouncycastle.fips.approved_only=true \
              -cp "target/classes:target/test-classes:$RUNNER_TEMP/bc-fips/bc-fips-$v.jar" \
              com.enssolutions.license.FipsCheck ../fixtures bc-fips-approved
            echo "::endgroup::"
          done
