# Static product site. Rendered into /usr/share/nginx/html at container start by
# /docker-entrypoint.d/30-render-site.sh, which is what resolves the demo URLs.
# The files themselves are built by Astro in the image's first stage.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nothing here is user-generated, but these cost nothing and keep the
    # scanners quiet.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # No directory listings.
    autoindex off;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  512;
    gzip_types       text/plain text/css application/javascript text/javascript image/svg+xml;

    # Container orchestrators want a cheap endpoint that does not read from disk.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Astro's bundles (the stylesheet and the page scripts) carry a content hash
    # in their file names, so a changed file is a new URL and they can be kept
    # for as long as the browser likes.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images under /assets/ keep their names; the render script versions every
    # reference to them by content hash instead. The demo URLs are filled in at
    # container start, so HTML must not be cached across a restart.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        add_header Cache-Control "no-cache";
        # Allow /products/readyroom as well as /products/readyroom.html.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
